<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ichorous web</title>
<meta name="description" content="Ichorous, statically recompiled from the original x64 Ichorous.exe to WebAssembly — no emulator, no interpreter.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>ichoruous web</h1>

  <div id="stage">
    <canvas id="game" width="320" height="180" tabindex="0"></canvas>
    <div id="overlay">
      <div class="bar"><div class="fill" id="bar-fill"></div></div>
      <div class="status" id="status">loading…</div>
    </div>
  </div>

  <p class="hint" id="hint" hidden>arrows / WASD to move · Z / J to attack · click the game first</p>
  <div class="error" id="error" hidden></div>
  <p class="diag" id="diag"></p>
  <p class="foot">static recompilation: Ichorous.exe x64 → WebAssembly · 5,555 lifted functions · no emulator, no interpreter</p>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
